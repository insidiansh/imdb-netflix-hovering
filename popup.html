<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; width: 300px; padding: 14px; background: #111; color: #fff; }
    h1 { font-size: 14px; margin: 0 0 10px; color: #f5c518; }
    label { font-size: 12px; opacity: 0.85; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px; background: #1c1c1c; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 13px; }
    button { margin-top: 10px; width: 100%; padding: 8px; background: #f5c518; color: #111; border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
    a { color: #f5c518; }
    p { font-size: 11px; opacity: 0.8; line-height: 1.4; }
    .status { font-size: 12px; margin-top: 8px; color: #6bd16b; min-height: 14px; }
  </style>
</head>
<body>
  <h1>★ IMDb Ratings</h1>
  <p>Get a free OMDb API key at <a href="https://www.omdbapi.com/apikey.aspx" target="_blank">omdbapi.com</a> (1,000 requests/day free), then paste it here.</p>
  <label for="key">OMDb API key</label>
  <input id="key" type="text" placeholder="e.g. abcd1234" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <p>Hover over any tile on Netflix, Prime Video, or JioHotstar to see its IMDb rating.</p>
  <script src="popup.js"></script>
</body>
</html>
